name: Docker Publish

# Every commit on main publishes :unstable; a release (vX.Y.Z tag) publishes the version tags
# and moves :latest. Nothing is built or pushed unless the integration tests pass first.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  integration-tests:
    uses: ./.github/workflows/integration-tests.yml

  build-and-push:
    needs: integration-tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/thomasgodon/dsmrhub
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
